<!DOCTYPE html>
<html lang="es">
<head>

    <title>Footer miFuturo</title>
    <!-- bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="footer.css">
</head>
<body>

            <!-- Columna 1 -->
            <div class="col-md-4 p-0">
                <div class="footer-title">[miFuturo]</div>
                <a href="https://www.google.com" target="_blank" class="footer-link">Home</a>
                <a href="https://www.google.com" target="_blank" class="footer-link">About</a>

            </div>

            <!-- Columna 2 -->
            <!-- pt-5 pra bajar los links y q queden alineados con los de la primera col -->
            <div class="col-md-4 p-0" style="padding-top: 5.5rem !important;">
                <a href="https://www.google.com" target="_blank" class="footer-link">Carreras</a>
                <a href="https://www.google.com" target="_blank" class="footer-link">Universidades</a>

            <!-- Columna 3 -->

                <a href="https://www.google.com" target="_blank" class="footer-link">FAQs</a>
            </div>

        </div>

        <!-- la linea separadora -->
        <hr class="footer-divider">

        <!-- la parte de abajo con flexbox pra separar izq y der -->
        <div class="d-flex justify-content-between align-items-center bottom-links">
            <div>
                <!-- aca esta el correo configurado pra que abra el gestor de emails -->
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=mifuturochile1@gmail.com" target="_blank">Contáctanos</a>
            </div>
            <div>
                <a href="https://www.google.com" target="_blank">Políticas de privacidad</a>
                <a href="https://www.google.com" target="_blank">Términos de servicio</a>
