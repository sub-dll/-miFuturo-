<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container-fluid vh-100">
        <div class="row h-100">
            
            <!-- Panel izquierdo -->
            <div class="col-md-5 col-lg-6 bg-slate d-none d-md-block"></div>

            <!-- Panel derecho (Formulario) -->
            <div class="col-md-7 col-lg-6 d-flex align-items-center justify-content-center">
                
                <div class="w-100 px-3" style="max-width: 400px;">
                    
                    <!-- Encabezado -->
                    <div class="text-center mb-5">
                        <h4 class="fw-bold mb-1">Change password</h4>
                    </div>

                    <form>
                        <!-- Campo Valid Email -->
                        <div class="input-group mb-3 rounded-2 overflow-hidden">
                            <input type="email" class="form-control border-0 py-2 ps-3 shadow-none text-muted small" placeholder="Valid email" required>
                            <span class="input-group-text border-0 text-muted pe-3"><i class="bi bi-envelope"></i></span>
                        </div>

                        <!-- Campo New Password -->
                        <div class="input-group mb-3 rounded-2 overflow-hidden">
                            <input type="password" class="form-control border-0 py-2 ps-3 shadow-none text-muted small" placeholder="new password" required>
                            <span class="input-group-text border-0 text-muted pe-3"><i class="bi bi-unlock"></i></span>
                        </div>

                        <!-- Campo Repeat Password -->
                        <div class="input-group mb-5 rounded-2 overflow-hidden">
                            <input type="password" class="form-control border-0 py-2 ps-3 shadow-none text-muted small" placeholder="Repeat password" required>
                            <span class="input-group-text border-0 text-muted pe-3"><i class="bi bi-unlock"></i></span>
                        </div>

                        <!-- BotÃ³n "Next" -->
                        <button type="submit" class="btn btn-slate w-100 py-2 mb-3 rounded-2 d-flex justify-content-center align-items-center gap-2">
                            Next <i class="bi bi-chevron-right text-xs"></i>
                        </button>
                    </form>

                </div>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
